  frigate:
    container_name: frigate
    privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "200mb" # update for your cameras based on calculation above
    devices:
      - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      #- /dev/apex_0:/dev/apex_0 # Passes a PCIe Coral, follow driver instructions here https://coral.ai/docs/m2/get-started/#2a-on-linux
      #- /dev/video11:/dev/video11 # For Raspberry Pi 4B
      #- /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
      #- /dev/dri:/dev/dri # Allows the iGPU to be used
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/arrrghhh/.frigate:/config
      - /data/video/frigate:/media/frigate
      - /home/arrrghhh/.frigate/logs:/dev/shm/logs
      # - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
      #   target: /tmp/cache
      #   tmpfs:
      #     size: 1000000000
    ports:
      - "8971:8971"
      - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:?FRIGATE_RTSP_PASSWORD missing from .env}
      - PLUS_API_KEY=${PLUS_API_KEY:?PLUS_API_KEY missing from .env}
      #- LIBVA_DRIVER_NAME=iHD # For intel hwaccel, specifically for Jasper Lake
      #- ONEDNN_MAX_CPU_ISA=DEFAULT # Helps bypass some AVX-related crashes
      #- DEVICE_NAME=GPU.0
      #- OPENVINO_IMAGE_LATTICE_EXP=0
  xcel_itron2mqtt:
      container_name: xcel_itron2mqtt
      image: ghcr.io/zaknye/xcel_itron2mqtt:main
      restart: unless-stopped
      volumes:
        - /home/arrrghhh/.xcel_itron2mqtt/certs:/opt/xcel_itron2mqtt/certs
      #network_mode: host
      networks:
        - summithouse_default
      environment:
        - MQTT_SERVER=mosquitto
        - METER_IP=192.168.1.80
        - METER_PORT=8081
networks:
  summithouse_default:
    external: true