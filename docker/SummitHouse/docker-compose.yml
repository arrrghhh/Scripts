name: summithouse
#version: "3"
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: bridge
    environment:
      TZ: 'America/Denver'
      WEBPASSWORD: '${WEBPASSWORD:?WEBPASSWORD missing from .env}'
    volumes:
      - '/home/arrrghhh/.pihole/etc-pihole/:/etc/pihole/'
      - '/home/arrrghhh/.pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/'
      #- '/home/arrrghhh/.pihole/lighthttpd:/etc/lighttpd'
    #cap_add:
      #- NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "82:80/tcp"
      - "9443:443/tcp"
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]
  homeassistant:
    container_name: homeassistant
    image: lscr.io/linuxserver/homeassistant:latest
    network_mode: host
    #ports:
    #  - "8123:8123/tcp"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - /home/arrrghhh/.homeassistant:/config
    restart: unless-stopped
  nginxproxmgr:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    container_name: nginxproxmgr
    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    # Uncomment the next line if you uncomment anything in the section
    # environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'
    volumes:
      - /home/arrrghhh/.nginxproxmgr:/data
      - /home/arrrghhh/.letsencrypt:/etc/letsencrypt
  matter-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    restart: unless-stopped
    volumes:
      - '/home/arrrghhh/.homeassistant/matter-server/:/data'
      - '/run/dbus:/run/dbus:ro'
    network_mode: host
    user: "1000:1000"
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    volumes:
      - /home/arrrghhh/.mosquitto/config:/mosquitto/config
      - /home/arrrghhh/.mosquitto/data:/mosquitto/data
      - /home/arrrghhh/.mosquitto/log:/mosquitto/log
    ports:
      - 1883:1883
      - 9001:9001
    stdin_open: true
    tty: true
    restart: unless-stopped
  # scrypted:
