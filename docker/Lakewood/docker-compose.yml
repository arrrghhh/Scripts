name: docker
#version: "3"
services:
  delugevpn:
    image: binhex/arch-delugevpn
    container_name: delugevpn
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - /media/complete:/data
      - /home/arrrghhh/.deluge/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VPN_ENABLED=yes
      - VPN_USER=${VPN_USER:?VPN_USER missing from .env}
      - VPN_PASS=${VPN_PASS:?VPN_PASS missing from .env}
      - VPN_PROV=pia
      - VPN_CLIENT=openvpn
      - STRICT_PORT_FORWARD=yes
      - ENABLE_PRIVOXY=no
      - LAN_NETWORK=192.168.0.0/24,181.41.206.0/24,37.19.210.0/24
      - NAME_SERVERS=84.200.69.80,37.235.1.174,1.1.1.1,37.235.1.177,84.200.70.40,1.0.0.1
      - DELUGE_DAEMON_LOG_LEVEL=info
      - DELUGE_WEB_LOG_LEVEL=info
      - VPN_INPUT_PORTS=
      - VPN_OUTPUT_PORTS=8112,58846
      - DEBUG=false
      - UMASK=000
      - PUID=1000
      - PGID=1000
    ports:
      - 8112:8112
      - 58846:58846
      - 58946:58946
    restart: unless-stopped
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - /home/arrrghhh/.sabnzbd:/config
      - /media/complete/Pre-Process:/complete
      - /media/complete/sabnzbd/Downloads:/nzbDownloads
    ports:
      - 8080:8080
    restart: unless-stopped
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - VERSION=docker
      - PUID=110
      - PGID=1004
    volumes:
      - /home/arrrghhh/.plex:/config
      - "/media/tvshows/TV Shows:/data/tvshows1"
      - "/media/tvshowstodel/TV Shows:/data/tvshows2"
      - "/media/tvshowscourt/TV Shows:/data/TVShowsCourt"
      - /media/tvshowstodel/TV Shows:/tvshows-del
      - /media/movies/Movies:/data/movies
      - /media/movies/CudlipHomeVideos:/data/CudlipHomeVideos
      - /media/movies/BresciaHomeVideos:/data/BresciaHomeVideos
    restart: unless-stopped
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: host
    #ports:
    #  - "8123:8123/tcp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - /home/arrrghhh/.homeassistant:/config
    restart: unless-stopped
  matter-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    restart: unless-stopped
    volumes:
      - '/home/arrrghhh/.homeassistant/matter-server/:/data'
      - '/run/dbus:/run/dbus:ro'
    network_mode: host
    user: "1000:1000"
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    volumes:
      - /home/arrrghhh/.mosquitto/config:/mosquitto/config
      - /home/arrrghhh/.mosquitto/data:/mosquitto/data
      - /home/arrrghhh/.mosquitto/log:/mosquitto/log
    ports:
      - 1883:1883
      - 9001:9001
    stdin_open: true
    tty: true
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - /home/arrrghhh/.radarr:/config
      - /media/movies/Movies:/movies #optional
      - /media/complete/Pre-Process:/complete
    ports:
      - 7878:7878
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - /home/arrrghhh/.sonarr:/config
      - "/media/tvshows/TV Shows:/tvshows"
      - "/media/tvshowscourt/TV Shows:/tvshows-court"
      - /media/tvshowstodel/TV Shows:/tvshows-del
      - /media/complete/Pre-Process:/complete
    ports:
      - 8989:8989
    restart: unless-stopped
  # govee2mqtt:
  #   image: ghcr.io/wez/govee2mqtt:latest
  #   container_name: govee2mqtt
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   network_mode: host
  #   volumes:
  #     - /home/arrrghhh/.govee2mqtt:/data
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: bridge
    ports:
      - "192.168.0.99:53:53/tcp"
      - "192.168.0.99:53:53/udp"
      - "82:80/tcp"
      - "9443:443/tcp"
    environment:
      TZ: 'America/Denver'
      WEBPASSWORD: '${WEBPASSWORD:?WEBPASSWORD missing from .env}'
    volumes:
      - '/home/arrrghhh/.pihole/etc-pihole/:/etc/pihole/'
      - '/home/arrrghhh/.pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/'
    restart: unless-stopped
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/arrrghhh/.nginxproxmgr:/data
      - /home/arrrghhh/.letsencrypt:/etc/letsencrypt

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - /home/arrrghhh/.prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
