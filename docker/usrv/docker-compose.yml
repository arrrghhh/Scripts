name: docker
# usrv is parked as of 2026-10-29: pihole + nginx-proxy-manager moved to
# Lakewood (nas) in commit 204c3fc. The hardware is being swapped, so this
# box becomes the new Silverthorne host and the usrv role is rebuilt on the
# Celeron afterwards.
#
# The idle service below exists only so docker-update@usrv (nightly
# `up -d --remove-orphans`) exits 0 instead of alerting on
# "no service selected". Delete it when usrv gets its next real workload.
services:
  idle:
    image: alpine:3
    container_name: usrv-idle
    command: ["sleep", "infinity"]
    restart: unless-stopped
